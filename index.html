  canvas.width = Math.max(1, Math.round(rect.width * dpr));
  canvas.height = Math.max(1, Math.round(rect.height * dpr));
  ctx.setTransform(1,0,0,1,0,0);
  ctx.scale(dpr, dpr);
  scale = Math.min(rect.width / VIEWBOX.w, rect.height / VIEWBOX.h);
  offsetX = (rect.width - VIEWBOX.w * scale) / 2;
  offsetY = (rect.height - VIEWBOX.h * scale) / 2;
  buildParticles();
  buildEdgeParticles();
}

function inGraffiti(wx, wy) {
  for (const p of pathObjects) {
    if (tctx.isPointInPath(p, wx, wy, 'evenodd')) return true;
    tctx.lineWidth = STROKE_WIDTH;
    tctx.lineJoin = 'round';
    tctx.lineCap = 'round';
    if (tctx.isPointInStroke(p, wx, wy)) return true;
  }
  return false;
}

function buildParticles() {
  particles.length = 0;
  for (let y = VIEWBOX.y + SPACING * 0.5; y < VIEWBOX.y + VIEWBOX.h; y += SPACING) {
    for (let x = VIEWBOX.x + SPACING * 0.5; x < VIEWBOX.x + VIEWBOX.w; x += SPACING) {
      if (particles.length >= MAX_PARTICLES) break;
      if (!inGraffiti(x, y)) continue;
      particles.push({
        x: x + (rand() - 0.5) * 5,
        y: y + (rand() - 0.5) * 5,
        dx: 0,
        dy: 0,
        vx: 0,
        vy: 0,
        spin: rand() < 0.5 ? -1 : 1,
        bit: rand() < 0.5 ? '0' : '1'
      });
    }
    if (particles.length >= MAX_PARTICLES) break;
  }
}


function buildEdgeParticles() {
  edgeParticles.length = 0;
  for (const path of measurePaths) {
    let len = 0;
    try { len = path.getTotalLength(); } catch(e) { continue; }
    for (let s = 0; s < len && edgeParticles.length < MAX_EDGE_PARTICLES; s += EDGE_SPACING) {
      const q = path.getPointAtLength(s);
      edgeParticles.push({
        x:q.x, y:q.y, dx:0, dy:0, vx:0, vy:0,
        spin:rand() < .5 ? -1 : 1,
        bit:rand() < .5 ? '0' : '1',
        edge:true
      });
    }
    if (edgeParticles.length >= MAX_EDGE_PARTICLES) break;
  }
}

function screenToWorld(clientX, clientY) {
  const rect = canvas.getBoundingClientRect();
  const sx = clientX - rect.left;
  const sy = clientY - rect.top;
  return {
    x: (sx - offsetX) / scale + VIEWBOX.x,
    y: (sy - offsetY) / scale + VIEWBOX.y
  };
}

canvas.addEventListener('pointerenter', e => {
  const p = screenToWorld(e.clientX, e.clientY);
  mouse.x = mouse.px = p.x;
  mouse.y = mouse.py = p.y;
  mouse.vx = mouse.vy = 0;
  mouse.active = true;
});
canvas.addEventListener('pointermove', e => {
  const p = screenToWorld(e.clientX, e.clientY);
  mouse.px = mouse.x; mouse.py = mouse.y;
  mouse.x = p.x; mouse.y = p.y;
  mouse.vx = mouse.x - mouse.px;
  mouse.vy = mouse.y - mouse.py;
  mouse.active = true;
});
canvas.addEventListener('pointerleave', () => { mouse.active = false; });

function updateParticle(p, mouseBoost) {
  if (mouse.active) {
    const rx = (p.x + p.dx) - mouse.x;
    const ry = (p.y + p.dy) - mouse.y;
    const dist2 = rx * rx + ry * ry;
    if (dist2 < RADIUS2) {
      const dist = Math.sqrt(dist2) || 1;
      const force = 1 - dist / RADIUS;
      const nx = rx / dist, ny = ry / dist;
      const tx = -ny, ty = nx;
      const push = force * force * (18 + mouseBoost);
      const swirl = force * (10 + mouseBoost * .7) * p.spin;
      p.vx += nx * push + tx * swirl + mouse.vx * .22 * force;
      p.vy += ny * push + ty * swirl + mouse.vy * .22 * force;
      if (Math.random() < .055 * force) p.bit = p.bit === '0' ? '1' : '0';
    }
  }
  p.vx += -p.dx * .22;
  p.vy += -p.dy * .22;
  p.vx *= .74;
  p.vy *= .74;
  p.dx += p.vx;
  p.dy += p.vy;
}

function drawParticle(p, edge=false) {
  const sx = offsetX + (p.x + p.dx - VIEWBOX.x) * scale;
  const sy = offsetY + (p.y + p.dy - VIEWBOX.y) * scale;
  if (edge) {
    // A black halo around each EDGE digit creates clear letter separation,
    // but the visible outline itself is still made entirely from 0s and 1s.
    ctx.save();
    ctx.font = `900 15px ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace`;
    ctx.lineWidth = 4.2;
    ctx.strokeStyle = '#000';
    ctx.shadowBlur = 0;
    ctx.strokeText(p.bit, sx, sy);
    ctx.fillStyle = '#98ff6b';
    ctx.shadowColor = '#39ff14';
    ctx.shadowBlur = 7;
    ctx.fillText(p.bit, sx, sy);
    ctx.restore();
  } else {
    ctx.fillText(p.bit, sx, sy);
  }
}

function tick() {
  const rect = canvas.getBoundingClientRect();
  ctx.clearRect(0, 0, rect.width, rect.height);
  ctx.fillStyle = '#39ff14';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.font = `700 ${FONT_SIZE}px ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace`;
  ctx.shadowColor = '#00ff66';
  ctx.shadowBlur = 5;

  const mv = Math.min(26, Math.hypot(mouse.vx, mouse.vy) * 2.5 + 5);

  for (const p of particles) {
    updateParticle(p, mv);
    drawParticle(p, false);
  }

  // Draw boundary digits LAST so each letter edge stays readable.
  for (const p of edgeParticles) {
    updateParticle(p, mv * 1.08);
    drawParticle(p, true);
  }

  requestAnimationFrame(tick);
}

window.addEventListener('resize', fit, {passive:true});
fit();
requestAnimationFrame(tick);
</script>
</body>
</html>
